name: Login System CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BACKEND CI
  # ==========================================

  backend-ci:
    name: Backend Build, Test and SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn clean test

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.LOGIN_SYSTEM_SONAR_TOKEN }}
        run: >
          mvn clean verify sonar:sonar
          -Dsonar.projectKey=Sanket-devloper_Project-Documentation-login-system
          -Dsonar.organization=sanket-devloper
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.qualitygate.wait=true


  # ==========================================
  # FRONTEND CI
  # ==========================================

  frontend-ci:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-frontend/auth-frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: auth-frontend/auth-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  # ==========================================
  # DOCKER BUILD & PUSH
  # ==========================================

  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-ci
      - frontend-ci

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # Java setup
      # ------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ------------------------------------------
      # Build backend JAR
      # ------------------------------------------

      - name: Build backend JAR
        working-directory: auth-backend
        run: mvn clean package -DskipTests


      # ------------------------------------------
      # Convert GitHub owner to lowercase
      # ------------------------------------------

      - name: Set lowercase image owner
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


      # ------------------------------------------
      # Login to GitHub Container Registry
      # ------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------
      # Build backend Docker image
      # ------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t ghcr.io/${IMAGE_OWNER}/project-documentation-login-system-backend:latest \
            ./auth-backend


      # ------------------------------------------
      # Build frontend Docker image
      # ------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ghcr.io/${IMAGE_OWNER}/project-documentation-login-system-frontend:latest \
            ./auth-frontend/auth-frontend


      # ------------------------------------------
      # Push backend image
      # ------------------------------------------

      - name: Push backend Docker image
        run: |
          docker push \
            ghcr.io/${IMAGE_OWNER}/project-documentation-login-system-backend:latest


      # ------------------------------------------
      # Push frontend image
      # ------------------------------------------

      - name: Push frontend Docker image
        run: |
          docker push \
            ghcr.io/${IMAGE_OWNER}/project-documentation-login-system-frontend:latest


  # ==========================================
  # CONTINUOUS DEPLOYMENT
  # ==========================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    # Deploy only after Docker images are successfully pushed
    # and only for direct pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - docker-publish

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/login-system

            echo "Pulling latest Docker images..."
            docker compose pull

            echo "Restarting application..."
            docker compose up -d

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully!"

            docker compose ps
